        Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
        & "$env:TEMP\rustup-init.exe" -y --default-host x86_64-pc-windows-msvc --default-toolchain stable --profile minimal
        if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
      }
      Add-AppveyorMessage 'Rust toolchain available'
